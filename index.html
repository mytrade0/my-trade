

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাই ট্রেডিং মার্কেট</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f141e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #1a2230;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3548;
        }
        .logo {
            font-size: 16px;
            font-weight: bold;
            color: #00e676;
        }
        .price-display {
            font-size: 15px;
            font-weight: bold;
        }
        #chart-container {
            flex: 1;
            width: 100%;
            height: 60vh;
        }
        .controls {
            background-color: #1a2230;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            gap: 10px;
            border-top: 1px solid #2a3548;
        }
        .btn {
            flex: 1;
            padding: 12px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
        }
        .btn-up { background-color: #00e676; color: #000; }
        .btn-down { background-color: #ff5252; }
        .btn-auto { background-color: #29b6f6; color: #000; }
    </style>
</head>
<body>

    <header>
        <div class="logo">OTC MARKET</div>
        <div class="price-display">প্রাইস: <span id="current-price">100.00</span></div>
    </header>

    <div id="chart-container"></div>

    <div class="controls">
        <button class="btn btn-up" onclick="setDirection('up')">UP ⬆</button>
        <button class="btn btn-auto" onclick="setDirection('auto')">Auto 🔄</button>
        <button class="btn btn-down" onclick="setDirection('down')">DOWN ⬇</button>
    </div>

    <script>
        const chartContainer = document.getElementById('chart-container');
        
        // চার্ট সেটআপ
        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: chartContainer.clientHeight || 400,
            layout: { backgroundColor: '#0f141e', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#1f293d' }, horzLines: { color: '#1f293d' } },
            timeScale: { timeVisible: true, secondsVisible: true }
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#00e676',
            downColor: '#ff5252',
            borderUpColor: '#00e676',
            borderDownColor: '#ff5252',
            wickUpColor: '#00e676',
            wickDownColor: '#ff5252',
        });

        // স্ক্রিন রিসাইজ সাপোর্ট
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });

        // ডেমো ডেটা জেনারেট
        let lastPrice = 100.00;
        let currentTime = Math.floor(Date.now() / 1000) - 150;
        let currentDirection = 'auto';

        let initialData = [];
        for (let i = 0; i < 30; i++) {
            let open = lastPrice;
            let close = open + (Math.random() - 0.5) * 1.5;
            let high = Math.max(open, close) + Math.random() * 0.5;
            let low = Math.min(open, close) - Math.random() * 0.5;
            lastPrice = close;
            currentTime += 5;
            initialData.push({ time: currentTime, open, high, low, close });
        }
        candlestickSeries.setData(initialData);

        // ডিরেকশন সেট ফাংশন
        function setDirection(dir) {
            currentDirection = dir;
        }

        // রিয়েল-টাইম ক্যান্ডেল আপডেট (প্রতি ১ সেকেন্ডে)
        setInterval(() => {
            let now = Math.floor(Date.now() / 1000);
            let change = Math.random() * 0.8 + 0.1;

            if (currentDirection === 'up') {
                lastPrice += change;
            } else if (currentDirection === 'down') {
                lastPrice -= change;
            } else {
                lastPrice += (Math.random() - 0.49) * 0.8;
            }

            let open = lastPrice - (Math.random() - 0.5) * 0.3;
            let high = Math.max(open, lastPrice) + Math.random() * 0.3;
            let low = Math.min(open, lastPrice) - Math.random() * 0.3;

            document.getElementById('current-price').innerText = lastPrice.toFixed(2);

            candlestickSeries.update({
                time: now,
                open: open,
                high: high,
                low: low,
                close: lastPrice
            });
        }, 1000);
    </script>
</body>
</html>
